name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar
        run: pip install -e .
      - name: Testes de aceite
        run: python -m unittest discover -s tests -v
      - name: Comandos ISTH e STH
        run: |
          isth decide --p0 0.9 --shots 512 > r.json
          sth verify r.json

  portao_hostil:
    # Chão de fábrica: nenhuma exceção crua pode passar para a fronteira.
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Campanha hostil, 3 sementes
        run: |
          for s in 2026 7 99; do
            python tools/roda_bugs.py --por-familia 500 --seed $s
          done

  portao_mcp:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Servidor MCP responde ao protocolo
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | isthmus-mcp | python -c "
          import json,sys
          r=json.loads(sys.stdin.readline())
          nomes=[t['name'] for t in r['result']['tools']]
          assert 'isthmus_verify' in nomes, nomes
          print('ferramentas:', len(nomes))"
