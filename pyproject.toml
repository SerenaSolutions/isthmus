[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isthmus"
version = "0.1.1"
description = "Sub-linguagem híbrida de interoperabilidade, controle e verificação do ecossistema ZEPHIRUM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Serena Solutions" }]
keywords = ["quantum", "verification", "receipts", "trivalent", "isthmus", "ist", "sth"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Physics",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/SerenaSolutions/isthmus"
Repository = "https://github.com/SerenaSolutions/isthmus"
Issues = "https://github.com/SerenaSolutions/isthmus/issues"

[project.scripts]
isthmus = "isthmus.cli:main"
isth = "isthmus.cli:main"
ist = "isthmus.cli:main"
sth = "isthmus.sth_cli:main"
isthmus-mcp = "isthmus_mcp.server:main"

[tool.setuptools]
packages = ["isthmus", "isthmus_mcp"]
